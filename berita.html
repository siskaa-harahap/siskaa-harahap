<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#fff;color:#222}

/* ================= HEADER ================= */
.top-header{
    padding:8px 30px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-circle{
    width:45px;height:45px;border-radius:50%;
    background:#008cff;
}
.top-header h3{font-size:18px;font-weight:600}

.navbar{
    display:flex;
    gap:25px;
    font-size:14px;
}
.navbar a{
    text-decoration:none;
    color:#444;
}
.navbar a.active,.navbar a:hover{
    color:#008cff;
    font-weight:600;
}

/* ================= SLIDER ================= */
.slider{
    width:100%;
    background:#b8e9ff;
    padding:25px;
    margin-top:5px;
}

.slide-container{
    background:#d2f1ff;
    border-radius:10px;
    padding:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.left-info{
    width:55%;
}

.left-info h2{
    font-size:28px;
    font-weight:700;
}
.left-info span{
    font-size:14px
}

.score-box{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    width:70%;
}

.score-title{font-size:18px}
.score-value{
    font-size:45px;
    color:#008cff;
    font-weight:800;
}
.score-note{
    font-size:18px;
    color:green;
    font-weight:700
}

/* ================= RIGHT GRAPH ================= */
.right-info{
    width:40%;
    background:white;
    padding:20px;
    border-radius:10px;
}

.right-info h4{text-align:center;margin-bottom:10px}

/* ================= FOOTER ================= */
.footer{
    margin-top:30px;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#eef3ff;
    border-top:1px solid #ccc;
}

/* RESPONSIVE */
@media(max-width:900px){
    .slide-container{
        flex-direction:column;
        gap:20px;
    }
    .left-info,.right-info{width:100%}
}
</style>
</head>
